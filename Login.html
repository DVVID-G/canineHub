<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Log in</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body 
    class="bg-secondary-subtle d-flex justify-content-center align-items-center">
        <div 
        class="bg-white p-4" 
        style="height:50rem">
            <div 
            class="d-flex justify-content-center">
                <img 
                src="assets/Logo Petlove.png" 
                alt="login-icon" 
                style="height:7rem"/>
            </div>

            <div class="text-center fs-1 fw-bold">Iniciar sesión</div>
            <div 
            class="input-group">
                <div 
                class="input-group-text bg-secondary-subtle">
                    <img 
                    src="assets/username-icon.png" 
                    alt="username-icon" 
                    style="height: 2rem"/>
                </div>
                <input 
                class="form-control" 
                type="text" 
                placeholder="Usuario"/>
            </div>
            <div 
            class="input-group mt-2">
                <div 
                class="input-group-text bg-secondary-subtle">
                    <img 
                    src="assets/password-icon.png" 
                    alt="password-icon" 
                    style="height: 2rem"/>
                </div>
                <input 
                class="form-control" 
                type="password" 
                placeholder="Contraseña"/>
            </div>
            <div class="justify-content-center">
                <!--RECORDAR LOS DATOS QUEDA SUJETO A DISCUSIÓN
                <div class="d-flex align-items-center">
                    <input  class="form-check-input" 
                            type="checkbox"/>
                    <div class="pt-2" 
                         style="font-size: 0.9rem">Recordar mis datos</div>-->
                <div class="text-center mt-1">
                    <a href="#" 
                    class="text-decoration-none text-info fw-semibold" 
                    style="font-size: 0.9rem"> Recordar contraseña</a></div>
                </div>

                <div class="btn btn-info w-100 mt-2">Inicio de sesión</div>
                    <div class="d-flex gap-1 justify-content-center mt-1">
                      <div>¿No tienes una cuenta?</div>
                         <a class="text-decoration-none text-info fw-semibold" href="/REGISTER USER/Registro usuarios.html"> Regístrate</a>
                        </div>
                    <div class="p-3">
                        <div class="border-bottom text-center" 
                             style="height:0.9rem">
                            <span class="bg-white px-3">o</span>
                        </div>
                    </div>
                    <div class="btn d-flex gap-2 justify-content-center border mt-1">
                        <img src="assets/google_13170545.png" 
                        alt="google-icon"
                         style="height:1.5rem"/>        
                     <div class="fw-semibold text-secondary">Continuar con google</div>
                    </div>
        </div>
    </body>
</html>
