<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Registro de Usuarios</title>
  </head>
  <body>
    <h1>Formulario de Registro</h1>
    <p>Por favor diligencie este formulario con la información solicitada</p>
    <form method="POST" action="#">
      <fieldset>
        <label for="first-name">Nombre: <input id="first-name" type="text" required /></label>
        <label for="last-name">Apellido: <input id="last-name" type="text" required /></label>
        <label for="email">Email: <input id="email" type="email" required /></label>
        <label for="new-password">Password: <input id="new-password" type="password" pattern="[a-z0-5]{8,}" required /></label>
      </fieldset>
      <fieldset>
        <!--<label>Fotografía: <input type="file" /></label>-->
        <label>Edad: <input type="number" min="13" max="120" /></label>
        <label>¿Cómo te enteraste de nosotros?
          <select>
            <option>(select one)</option>
            <option>Televisión</option>
            <option>Redes sociales</option>
            <option>Correo electrónic</option>
            <option>Otros</option>
          </select>
        </label>
      </fieldset>
      <label for="terms-and-conditions">
        <input id="terms-and-conditions" type="checkbox" required /> Acepto <a href="https://www.freecodecamp.org/news/terms-of-service/">los términos y condiciones</a>
      </label>
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
