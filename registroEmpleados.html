<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios Internos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        form, .user-list {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Gestión de Usuarios Internos</h1>

    <!-- Crear Usuario Interno -->
    <h2>Crear Usuario Interno</h2>
    <form action="/crear-usuario" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe el nombre completo" required>

        <label for="rol">Rol:</label>
        <select id="rol" name="rol" required>
            <option value="">Selecciona un rol</option>
            <option value="Administrador">Administrador</option>
            <option value="Asesor de Ventas">Asesor de Ventas</option>
        </select>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Correo electrónico del usuario" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>

        <button type="submit">Crear Usuario</button>
    </form>

    <!-- Listar Usuarios Internos con Filtros -->
    <h2>Listar Usuarios Internos</h2>
    <form class="filter-section" action="/listar-usuarios" method="get">
        <select name="filtro-rol">
            <option value="">Filtrar por Rol</option>
            <option value="Administrador">Administrador</option>
            <option value="Asesor de Ventas">Asesor de Ventas</option>
        </select>
        <select name="filtro-estado">
            <option value="">Filtrar por Estado</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>
        <button type="submit">Filtrar</button>
    </form>
    <div class="user-list">
        <!-- Aquí se mostraría la lista de usuarios internos con los filtros aplicados -->
        <p>No hay usuarios listados.</p>
    </div>

    <!-- Actualizar Datos de Usuario Interno -->
    <h2>Actualizar Datos de Usuario</h2>
    <form action="/actualizar-usuario" method="post">
        <label for="id-usuario">ID del Usuario:</label>
        <input type="text" id="id-usuario" name="id-usuario" placeholder="Ingrese el ID del usuario a actualizar" required>

        <label for="nuevo-rol">Nuevo Rol:</label>
        <select id="nuevo-rol" name="nuevo-rol" required>
            <option value="">Selecciona un nuevo rol</option>
            <option value="Administrador">Administrador</option>
            <option value="Asesor de Ventas">Asesor de Ventas</option>
        </select>

        <label for="nuevo-estado">Estado:</label>
        <select id="nuevo-estado" name="nuevo-estado">
            <option value="">Selecciona el estado</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>

        <button type="submit">Actualizar Usuario</button>
    </form>

    <!-- Borrar Usuario Interno -->
    <h2>Borrar Usuario</h2>
    <form action="/borrar-usuario" method="post">
        <label for="id-borrar">ID del Usuario:</label>
        <input type="text" id="id-borrar" name="id-borrar" placeholder="Ingrese el ID del usuario a eliminar" required>

        <button type="submit" style="background-color: #e74c3c;">Borrar Usuario</button>
    </form>

    <!-- Iniciar Sesión -->
    <h2>Iniciar Sesión</h2>
    <form action="/iniciar-sesion" method="post">
        <label for="email-login">Correo Electrónico:</label>
        <input type="email" id="email-login" name="email-login" placeholder="Ingresa tu correo" required>

        <label for="password-login">Contraseña:</label>
        <input type="password" id="password-login" name="password-login" placeholder="Ingresa tu contraseña" required>

        <!-- Simulación de CAPTCHA -->
        <label for="captcha">Resuelve el CAPTCHA: ¿Cuánto es 5 + 3?</label>
        <input type="text" id="captcha" name="captcha" placeholder="Escribe tu respuesta" required>

        <button type="submit">Iniciar Sesión</button>
    </form>

    <!-- Opción de Iniciar Sesión con Redes Sociales -->
    <div>
        <p>O inicia sesión con:</p>
        <button style="background-color: #1877F2; color: white;">Facebook</button>
        <button style="background-color: #1DA1F2; color: white;">Twitter</button>
        <button style="background-color: #DB4437; color: white;">Google</button>
    </div>

</body>
</html>
